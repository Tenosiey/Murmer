# Fast quality gate for the checks listed in AGENTS.md. Runs on pull
# requests, which is how every change lands (feature branches and Dependabot
# alike), and on pushes to the integration branches, so the merged result is
# checked too. Restricting `push` to main/dev keeps a pull request's own
# branch from triggering a second, identical run alongside it.
#
# Three parallel jobs: the frontend checks finish in a minute or two and
# should not wait behind the Tauri shell's WebKitGTK install and compile.
#
# The slow part — installers, signing, updater manifest — stays in
# `release.yml`, which is tag-triggered.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A newer push to the same branch makes the in-flight run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bun 1.x is a hard constraint (AGENTS.md); `latest` would move to 2.0
      # on the day it ships. A caret range, not `1.x`: setup-bun's matcher
      # reads `1.x` as an older release.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "^1.0.0"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('murmer_client/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        working-directory: murmer_client
        run: bun install --frozen-lockfile

      - name: TypeScript + Svelte diagnostics
        working-directory: murmer_client
        run: bun run check

      - name: Unit tests
        working-directory: murmer_client
        run: bun run test

  tauri:
    name: Tauri shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "^1.0.0"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('murmer_client/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        working-directory: murmer_client
        run: bun install --frozen-lockfile

      # Produces `murmer_client/build/`, which the Tauri shell needs:
      # `frontendDist` points at it and tauri-build fails when it is missing.
      - name: Build frontend
        working-directory: murmer_client
        run: bun run build

      # Tauri 2 links against the system WebKitGTK stack; without these the
      # shell does not even compile on a bare runner. Matches the Linux
      # prerequisites in the Tauri docs, minus the bundling-only tools.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file

      # Installs the toolchain pinned in the repo-root `rust-toolchain.toml`
      # (channel + clippy/rustfmt). Naming a channel here instead would only
      # download a second toolchain that rustup then overrides.
      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: murmer_client/src-tauri

      - name: Rust formatting (Tauri shell)
        working-directory: murmer_client/src-tauri
        run: cargo fmt --check

      - name: Clippy (Tauri shell)
        working-directory: murmer_client/src-tauri
        run: cargo clippy --all-targets -- -D warnings

  server:
    name: Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup show

      # The server's Docker image builds with its own Rust, named in the
      # Dockerfile. Dependabot moves both in one pull request; this keeps a
      # hand edit to either from letting them drift.
      - name: Docker builder image matches the pinned toolchain
        run: |
          pinned=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          if [ -z "$pinned" ]; then
            echo "No channel found in rust-toolchain.toml"; exit 1
          fi
          if ! grep -q "^FROM docker.io/library/rust:${pinned}-" murmer_server/Dockerfile; then
            echo "murmer_server/Dockerfile does not build with Rust ${pinned} from rust-toolchain.toml"; exit 1
          fi

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: murmer_server

      - name: Rust formatting
        working-directory: murmer_server
        run: cargo fmt --check

      # rusqlite is built with the `bundled` feature, so SQLite compiles from
      # source here — no libsqlite3-dev needed.
      - name: Clippy
        working-directory: murmer_server
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: murmer_server
        run: cargo test
