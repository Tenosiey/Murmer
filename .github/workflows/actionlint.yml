# Lints the workflows themselves whenever one changes. A typo in a workflow
# fails silently: a misspelt key or expression makes GitHub skip the job or
# reject the file, and nothing goes red until the run that mattered (a
# release, a Monday audit) never happens. actionlint also runs shellcheck
# over every `run:` block.
name: Actionlint

on:
  push:
    branches: [main, dev]
    paths:
      - .github/workflows/**
  pull_request:
    branches: [main, dev]
    paths:
      - .github/workflows/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Built from source with the runner's preinstalled Go: the module
      # checksum database pins what `@v1.7.7` resolves to, which a plain
      # download script would not, and no further third-party action is
      # added (taiki-e/install-action does not ship actionlint).
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Lint workflows
        run: "$(go env GOPATH)/bin/actionlint"
