# Builds, signs and publishes a Windows release (NSIS installer + updater
# artifacts + latest.json) whenever a version tag like v2026.710.0 is
# pushed. The in-app updater reads latest.json from the latest GitHub release.
name: Release

on:
  push:
    tags:
      - 'v*'
  # Run from main when a tag cannot be pushed: tauri-action then creates the
  # tag itself, on the commit the run was started from.
  workflow_dispatch:

jobs:
  release:
    # A manual run publishes whatever branch it was started on; only main
    # carries a finished release.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "^1.0.0"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('murmer_client/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # The toolchain pinned in rust-toolchain.toml, which cargo would switch
      # to anyway; installing `stable` first only downloaded a second one.
      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: murmer_client/src-tauri

      - name: Install frontend dependencies
        working-directory: murmer_client
        run: bun install --frozen-lockfile

      - name: Build and publish release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: murmer_client
          # The app version from tauri.conf.json, so a manual run names the
          # release the same way a pushed tag does.
          tagName: 'v__VERSION__'
          releaseName: 'Murmer v__VERSION__'
          releaseBody: 'See the assets below to download and install this version.'
          # Appends GitHub's generated notes below the body: every pull
          # request merged since the previous release, by title and author.
          # They are the patch notes, so PR titles are written for users.
          generateReleaseNotes: true
          # Must stay a normal release (not draft/prerelease): the updater
          # endpoint releases/latest/download/latest.json skips prereleases.
          releaseDraft: false
          prerelease: false
