# Builds, signs and publishes a Windows release (NSIS installer + updater
# artifacts + latest.json) whenever a version tag like v2026.710.0 is
# pushed. The in-app updater reads latest.json from the latest GitHub release.
name: Release

on:
  push:
    tags:
      - 'v*'
  # Run from main when a tag cannot be pushed: tauri-action then creates the
  # tag itself, on the commit the run was started from.
  workflow_dispatch:

jobs:
  release:
    # A manual run publishes whatever branch it was started on; only main
    # carries a finished release.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "^1.0.0"

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('murmer_client/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # The toolchain pinned in rust-toolchain.toml, which cargo would switch
      # to anyway; installing `stable` first only downloaded a second one.
      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: murmer_client/src-tauri

      - name: Install frontend dependencies
        working-directory: murmer_client
        run: bun install --frozen-lockfile

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: murmer_client
          # The app version from tauri.conf.json, so a manual run names the
          # release the same way a pushed tag does.
          tagName: 'v__VERSION__'
          releaseName: 'Murmer v__VERSION__'
          releaseBody: 'See the assets below to download and install this version.'
          # Must stay a normal release (not draft/prerelease): the updater
          # endpoint releases/latest/download/latest.json skips prereleases.
          releaseDraft: false
          prerelease: false
