services:
  server:
    build: ./murmer_server
    # Or skip the build and run a released server; README.md has the details.
    # image: ghcr.io/tenosiey/murmer-server:latest
    restart: unless-stopped
    # Load optional settings like ADMIN_TOKEN from a `.env` file
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/murmer.db
      UPLOAD_DIR: /app/uploads
      # Uncomment to require a password for WebSocket connections
      # SERVER_PASSWORD: changeme
      # Rate limiting configuration
      MAX_MESSAGES_PER_MINUTE: 300
      MAX_AUTH_ATTEMPTS_PER_MINUTE: 5
      # People allowed in one voice channel; 0 removes the cap
      MAX_VOICE_CHANNEL_USERS: 10
      # Allow the desktop client dev server to access the HTTP endpoints during development
      CORS_ALLOW_ORIGINS: http://localhost:1420
      # Serve the web client at / on this same origin (no CORS needed). Build
      # it first with `bun run build` in murmer_client/ and mount it below.
      # WEB_CLIENT_DIR: /app/web
      # Carry voice channels of SFU_THRESHOLD (default 7) or more people
      # through the server instead of peer to peer. Set the address clients
      # reach this host on, and uncomment the UDP port below with it.
      # SFU_PUBLIC_IP: 203.0.113.10
      # SFU_UDP_PORT: 3479
      # SFU_THRESHOLD: 7
      # SFU_RETURN_THRESHOLD: 4
    ports:
      - "3001:3001"
      # - "3479:3479/udp"
    volumes:
      - db_data:/app/data
      - uploads:/app/uploads
      # Uncomment together with WEB_CLIENT_DIR above to serve the web client
      # - ./murmer_client/build:/app/web:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
volumes:
  db_data:
  uploads:
