[package]
name = "murmer_client"
version = "2026.728.2"
description = "Murmer desktop client (Tauri shell)"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "murmer_client_lib"
# Desktop only, so an rlib for `main.rs` to link against is all that is needed.
# The Tauri template also asks for a `staticlib` (the iOS artifact) and a
# `cdylib` (the Android one); nothing consumes either here, and building them
# cost a 1.1 GB archive and a 299 MB shared object on every build.
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
# "image-png" lets the tray swap between the bundled light/dark logo PNGs at
# runtime (see `set_tray_theme` in src/lib.rs).
tauri = { version = "2.10", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Same glib that gtk/tao already pull in; used to filter tray-icon log spam.
glib = "0.22"

# Debug info dominates link time here the same way it does on the server: full
# DWARF over the whole Tauri/wry/webkit dependency tree put 366 MB into every
# relink, which made a one-line change in `src/lib.rs` cost 12.8 s. Line tables
# still give panics and backtraces their file:line, which is all a dev build of
# the shell is used for, and `unpacked` leaves the rest beside the binary
# instead of copying it in at link time. Measured: 12.8 s -> 1.5 s, 366 -> 97 MB.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

